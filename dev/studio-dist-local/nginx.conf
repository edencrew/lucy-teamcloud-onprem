# lucy-studio-dist 안의 nginx. Notion 계약 3.4 그대로.
server {
    listen 80;
    listen [::]:80;   # busybox wget 이 localhost 를 ::1 로 먼저 푸므로 IPv6 도 받는다 (compose healthcheck)
    root /usr/share/nginx/html;
    autoindex off;
    sendfile on;
    # Range 요청은 nginx 정적 서빙이 기본 지원한다 (MSIX 블록 차분에 필수)

    types {
        application/json               json;
        application/xml                xml;
        application/appinstaller       appinstaller;
        application/msix               msix;
        application/zip                zip;
        application/x-apple-diskimage  dmg;
        application/octet-stream       delta exe;
    }

    # 피드는 캐시 금지. 캐시되면 새 버전을 게시해도 클라이언트가 옛것을 본다
    location ~* (appcast\.xml|\.appinstaller|latest\.json)$ {
        add_header Cache-Control "no-cache, max-age=0";
    }

    # 패키지는 불변
    location ~* \.(zip|dmg|msix|delta|exe)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /healthz {
        access_log off;
        return 200 "OK";
    }
}
