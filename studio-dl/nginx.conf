# studio-dl (공식 nginx 이미지)의 /etc/nginx/conf.d/default.conf. Studio 릴리스를 업로드받은 tc-be 가
# 공유 볼륨에 current -> releases/<releaseId>/html 상대 심링크를 교체하므로 그 심링크를 root 로 둔다.
# nginx 는 요청마다 경로를 풀어서(disable_symlinks 기본 off) 교체 즉시 새 릴리스를 서빙한다.
# 첫 업로드 전에는 current 가 없어 /healthz 외 모든 경로가 404 다.
# 규칙은 dev/studio-dist-local/nginx.conf(이전 파일 내장형 참조 구현)와 같다.
server {
    listen 80;
    listen [::]:80;   # busybox wget 이 localhost 를 ::1 로 먼저 푸므로 IPv6 도 받는다 (compose healthcheck)
    root /srv/studio/current;
    autoindex off;
    sendfile on;
    # Range 요청은 nginx 정적 서빙이 기본 지원한다 (MSIX 블록 차분에 필수)

    types {
        application/json               json;
        application/xml                xml;
        application/appinstaller       appinstaller;
        application/msix               msix;
        application/zip                zip;
        application/x-apple-diskimage  dmg;
        application/octet-stream       delta exe;
    }

    # 피드는 캐시 금지. 캐시되면 새 버전을 게시해도 클라이언트가 옛것을 본다
    location ~* (appcast\.xml|\.appinstaller|latest\.json)$ {
        add_header Cache-Control "no-cache, max-age=0";
    }

    # 패키지는 불변
    location ~* \.(zip|dmg|msix|delta|exe)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /healthz {
        access_log off;
        return 200 "OK";
    }
}
