name: lucy-teamcloud-onprem

networks:
  internal-network:
    external: false

volumes:
  # tc-be 가 업로드받은 Studio 릴리스를 풀어 두는 볼륨. current -> releases/<releaseId>/html 상대 심링크를
  # tc-be 가 교체하고 studio-dl 이 읽기 전용으로 서빙한다. 재업로드로 복구되므로 백업 대상은 아니다.
  studio-release:

services:
  init-secrets:
    image: lucy-teamcloud-onprem-init-secrets:offline
    build:
      context: ./init-secrets
    platform: ${TARGET_PLATFORM:-linux/amd64}
    restart: "no"
    environment:
      EXTERNAL_URL: ${EXTERNAL_URL}
    volumes:
      - ./secrets:/secrets
      - ./nginx/certs:/certs

  gw:
    image: docker.io/library/nginx:1.26-alpine
    platform: ${TARGET_PLATFORM:-linux/amd64}
    restart: unless-stopped
    networks:
      - internal-network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      broker:
        condition: service_started
      git:
        condition: service_started
      auth-be:
        condition: service_healthy
      auth-fe:
        condition: service_started
      tc-be:
        condition: service_healthy
      tc-fe:
        condition: service_started
      studio-dl:
        condition: service_started

  git:
    image: docker.gitea.com/gitea:1.25.3
    platform: ${TARGET_PLATFORM:-linux/amd64}
    restart: unless-stopped
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      - LUCY_ADMIN_NAME=${LUCY_ADMIN_NAME}
      - LUCY_ADMIN_PASSWORD=${LUCY_ADMIN_PASSWORD}
      - EXTERNAL_URL=${EXTERNAL_URL}
      - USER_UID=${HOST_UID:-1000}
      - USER_GID=${HOST_GID:-1000}
      - TZ=${TZ:-UTC}
      - GITEA__database__USER=${DB_USERNAME}
      - GITEA__database__PASSWD=${DB_PASSWORD}
      - GITEA__server__DISABLE_SSH=true
    networks:
      - internal-network
    volumes:
      - ./git/data:/data
      - ./git/app.ini:/app.ini.default:ro
      - ./git/gitea-entrypoint.sh:/gitea-entrypoint.sh:ro
      - ./secrets:/run/secrets:ro
    entrypoint: ["/bin/sh", "/gitea-entrypoint.sh"]

  db:
    image: docker.io/library/postgres:17
    platform: ${TARGET_PLATFORM:-linux/amd64}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      - POSTGRES_PASSWORD=${DB_ROOT_PASSWORD}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - TZ=${TZ:-UTC}
    networks:
      - internal-network
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro

  broker:
    image: docker.io/library/eclipse-mosquitto:2.0.22
    platform: ${TARGET_PLATFORM:-linux/amd64}
    restart: unless-stopped
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./broker/data:/mosquitto/data
      - ./broker/logs:/mosquitto/log
    networks:
      - internal-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  auth-be:
    image: public.ecr.aws/edencrew/lucy-auth-be:onprem-prod-0.1.0
    platform: ${TARGET_PLATFORM:-linux/amd64}
    restart: unless-stopped
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      SERVICE_ENV: onprem
      SERVICE_PORT: 80
      FRONTEND_URL: ${EXTERNAL_URL}/auth
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: lucy_auth
      DATABASE_URL: "postgresql://${DB_USERNAME}:${DB_PASSWORD}@db:5432/lucy_auth"
      ADMIN_EMAIL: ${LUCY_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${LUCY_ADMIN_PASSWORD}
      ADMIN_NAME: ${LUCY_ADMIN_NAME}
      JWT_EXPIRES_TIME: 60m
      OIDC_ISSUER: ${EXTERNAL_URL}/auth
      EXTERNAL_URL: ${EXTERNAL_URL}
      NODE_EXTRA_CA_CERTS: /certs/server.crt
    volumes:
      - ./secrets:/run/secrets:ro
      - ./auth/auth-entrypoint.sh:/auth-entrypoint.sh:ro
      - ./nginx/certs/server.crt:/certs/server.crt:ro
      - ./auth/logs:/app/logs
    entrypoint: ["/bin/sh", "/auth-entrypoint.sh"]
    networks:
      - internal-network

  tc-be:
    image: public.ecr.aws/edencrew/lucy-teamcloud-be:onprem-prod-0.0.21
    platform: ${TARGET_PLATFORM:-linux/amd64}
    restart: unless-stopped
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      SERVICE_ENV: onprem
      SERVICE_PORT: 80
      TEAMCLOUD_URL: ${EXTERNAL_URL}
      AUTH_SERVER_URL: ${EXTERNAL_URL}/auth
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: lucy_teamcloud
      DATABASE_URL: "postgresql://${DB_USERNAME}:${DB_PASSWORD}@db:5432/lucy_teamcloud"
      GIT_PROVIDER: gitea
      GIT_HOST: http://git:18080
      GIT_USERNAME: ${LUCY_ADMIN_NAME}
      GIT_PASSWORD: ${LUCY_ADMIN_PASSWORD}
      WEBHOOK_URL: "http://tc-be/api/webhooks/gitea"
      OIDC_CLIENT_ID: lucy-teamcloud-oidc-client-id
      BROKER_WS_URL: ${BROKER_WS_URL}
      PUBLIC_BROKER_WS_URL: ${PUBLIC_BROKER_WS_URL}
      NODE_EXTRA_CA_CERTS: /certs/server.crt
      STUDIO_RELEASE_DIR: /data/studio-releases
    volumes:
      - ./secrets:/run/secrets:ro
      - ./tc/tc-entrypoint.sh:/tc-entrypoint.sh:ro
      - ./license:/app/license:ro
      - ./nginx/certs/server.crt:/certs/server.crt:ro
      - ./tc/logs:/app/logs
      # 이미지가 /data/studio-releases 를 uid 1001 소유로 만들어 두어, 빈 named volume 이 첫 마운트 때 소유자를
      # 물려받는다. bind mount 로 바꾸려면 호스트 디렉터리를 1001 소유로 만들어야 한다.
      - studio-release:/data/studio-releases
    entrypoint: ["/bin/sh", "/tc-entrypoint.sh"]
    networks:
      - internal-network

  tc-fe:
    image: public.ecr.aws/edencrew/lucy-teamcloud-fe:onprem-prod-0.0.17
    platform: ${TARGET_PLATFORM:-linux/amd64}
    restart: unless-stopped
    networks:
      - internal-network

  auth-fe:
    image: public.ecr.aws/edencrew/lucy-auth-fe:onprem-prod-0.1.0
    platform: ${TARGET_PLATFORM:-linux/amd64}
    restart: unless-stopped
    networks:
      - internal-network

  # Studio 설치 파일(DMG/ZIP) 정적 서빙. gw 의 /studio/ 로만 접근하고 외부 포트는 열지 않는다.
  # Studio 배포는 TC 업로드(scripts/studio-upload.sh)로만 하며, Studio 릴리스마다 이 tag 를 올리지 않는다.
  # 지금 이미지는 Studio 한 빌드를 내장한 이전 방식이라 업로드한 릴리스를 서빙하지 못한다.
  # TODO: Studio 팀의 볼륨 서빙 이미지(파일을 굽지 않고 <마운트>/current 를 root 로 서빙)가 나오면 image 교체,
  #   STUDIO_BASE_URL 제거, 아래 마운트 활성화를 한 번에 한다. 지금 이미지에 마운트만 붙이면 서빙 트리가 바뀌지 않는다.
  #   volumes:
  #     - studio-release:/srv/studio:ro
  studio-dl:
    image: public.ecr.aws/edencrew/lucy-studio-dist:onprem-prod-0.0.34.345
    platform: ${TARGET_PLATFORM:-linux/amd64}
    restart: unless-stopped
    environment:
      # 이미지 안 Sparkle appcast / .appinstaller 의 절대 URL prefix. 고객이 접속하는 주소 그대로.
      STUDIO_BASE_URL: ${EXTERNAL_URL}/studio
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal-network
