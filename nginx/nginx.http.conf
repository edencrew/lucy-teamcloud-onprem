events {
    worker_connections 1024;
}

# HTTP 전용 게이트웨이 템플릿 (TC_PROTOCOL=http).
# 기본(https) 템플릿은 nginx/nginx.conf 이며 80+443 을 모두 리슨한다(301 리다이렉트 없음).
# 이 파일은 릴리스 소유(payload)이며 고객 override 로 복사/수정하지 않는다.
# 선택은 루트 .env 의 TC_PROTOCOL 로만 하고, ops 가 EXTERNAL_URL(http://)·
# BROKER_WS_URL/PUBLIC_BROKER_WS_URL(ws://)·TC_HTTP_PORT 일치를 함께 검증한다.

http {
    upstream tc-fe {
        server tc-fe:80;
    }

    upstream tc-be {
        server tc-be:80;
    }

    upstream auth-fe {
        server auth-fe:80;
    }

    upstream auth-be {
        server auth-be:80;
    }

    upstream git {
        server git:18080;
    }

    upstream broker-ws {
        server broker:8080;
    }

    upstream studio-dl {
        server studio-dl:80;
    }

    # WebSocket upgrade 헤더 매핑 (Upgrade 요청이면 "upgrade", 아니면 "close")
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        listen [::]:80;

        # ALB health check
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK";
        }

        # 로그아웃 form action url 조정 (nginx.conf 와 동일, 커스텀 포트 보존)
        location /api/v1/oidc/ {
            return 307 $scheme://$http_host/auth$request_uri;
        }

        # /auth/api -> auth-be
        location /auth/api/ {
            absolute_redirect off;
            proxy_pass http://auth-be/api/;
            proxy_cookie_path /api/ /auth/api/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /auth -> auth-fe
        location /auth/ {
            absolute_redirect off;
            proxy_pass http://auth-fe/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /git -> tc-be (Git HTTP Proxy)
        location /git/ {
            proxy_pass http://tc-be/git/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 250m;
        }

        # /mqtt -> broker (WS → broker WS 리버스 프록시, MQTT-over-WebSocket)
        location ^~ /mqtt {
            proxy_pass http://broker-ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # /studio -> studio-dl
        location /studio/ {
            proxy_pass http://studio-dl/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 600s;
        }

        # Studio 번들 업로드 (~1GB)
        location = /api/v1/onprem/studio-releases {
            proxy_pass http://tc-be/api/v1/onprem/studio-releases;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 4g;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # /api -> tc-be
        location /api/ {
            proxy_pass http://tc-be/api/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # / -> tc-fe (기본)
        location / {
            proxy_pass http://tc-fe/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
