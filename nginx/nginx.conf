events {
    worker_connections 1024;
}

# 이 파일은 템플릿이다. nginx 이미지 stock entrypoint 가 컨테이너 /etc/resolv.conf 의 nameserver 를
# NGINX_LOCAL_RESOLVERS 로 내보내고(15-local-resolvers), envsubst 가 그 변수 하나만 치환해
# /etc/nginx/nginx.conf 로 렌더링한다(20-envsubst-on-templates, FILTER). 업스트림은 변수 proxy_pass 로
# 요청 시 조회하므로 서비스가 재기동해 IP 가 바뀌어도 gw 재시작 없이 최대 valid(10s) 안에 새 IP 로 붙는다.

http {
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    resolver_timeout 5s;

    # WebSocket upgrade 헤더 매핑 (Upgrade 요청이면 "upgrade", 아니면 "close")
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        listen [::]:80;
        listen 443 ssl;
        listen [::]:443 ssl;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # 업스트림 주소. 변수로 두어야 nginx 가 기동 시 IP 를 고정하지 않고 resolver 로 재조회한다.
        set $tc_fe     tc-fe:80;
        set $tc_be     tc-be:80;
        set $auth_fe   auth-fe:80;
        set $auth_be   auth-be:80;
        set $broker_ws broker:8080;
        set $studio_dl studio-dl:80;

        # ALB health check
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK";
        }

        # 로그아웃 form action url 조정
        # oidc-provider 가 만드는 form action 은 /api/v1/oidc/... 로 시작해
        # /auth/api/ 라우팅을 비껴가므로, 여기서 307 로 prefix 를 보정한다.
        # $http_host 를 명시해 커스텀 포트가 Location 헤더에 보존되도록 한다
        # (path-only 값으로 두면 nginx 가 $scheme://$host 기준 절대화하면서 포트 소실).
        location /api/v1/oidc/ {
            return 307 $scheme://$http_host/auth$request_uri;
        }

        # /auth/api -> auth-be (경로가 더 구체적인 순으로 정의)
        # 변수 proxy_pass 는 URI 치환을 하지 않으므로 rewrite 로 /auth 를 떼고(query 는 유지) 넘긴다.
        location /auth/api/ {
            # nginx 가 자동 생성하는 Location 헤더(trailing-slash 301 등)를 상대 URL 로.
            # 절대 URL 은 $scheme://$host 기반이라 커스텀 포트가 누락됨.
            absolute_redirect off;
            rewrite ^/auth(/api/.*)$ $1 break;       # request path 는 /auth/ 제거
            proxy_pass http://$auth_be;
            proxy_redirect http://auth-be/api/ /auth/api/;
            proxy_cookie_path /api/ /auth/api/;      # 쿠키 path만 그데로 사용
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /auth -> auth-fe
        location /auth/ {
            # /auth/api/ 와 동일 이유 — 커스텀 포트 보존을 위해 자동 redirect 를 상대 URL 로.
            absolute_redirect off;
            rewrite ^/auth(/.*)$ $1 break;
            proxy_pass http://$auth_fe;
            proxy_redirect http://auth-fe/ /auth/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /git -> tc-be (Git HTTP Proxy)
        # tc-be의 GitProxyService가 인증/권한 검사 후 내부 Gitea로 프록시
        location /git/ {
            proxy_pass http://$tc_be;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 250m;
        }

        # /gitea -> gitea (디버깅/고객지원용, 평소엔 비활성)
        # 원칙적으로 Git 서버는 외부에 직접 노출하지 않음. 위 /git/ 경유로만 접근.
        # 디버깅 등 필요한 경우에만 아래 블록의 주석을 해제하여 사용.
        # location /gitea/ {
        #     set $git git:18080;
        #     rewrite ^/gitea(/.*)$ $1 break;
        #     proxy_pass http://$git;
        #     proxy_set_header Host $http_host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        # /mqtt -> broker (WSS/WS → broker WS 리버스 프록시, MQTT-over-WebSocket)
        # ^~ prefix 매치로 /mqtt, /mqtt/ 둘 다 수용 (location /mqtt/ 만 두면
        # trailing slash 없는 요청에 nginx 가 301 redirect 를 내려 WS handshake 가 실패).
        # proxy_pass 끝에 URI 를 두지 않아 원본 path 가 그대로 broker 에 전달됨.
        location ^~ /mqtt {
            proxy_pass http://$broker_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # MQTT keepalive 동안 유휴 연결이 끊기지 않도록 타임아웃 확대
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # /studio -> studio-dl (Studio 설치 파일 다운로드, 정적 서빙)
        # Studio onprem 빌드가 로그인 주소 + /studio/latest.json 으로 새 버전을 조회한다.
        # 수백 MB 파일이라 proxy_buffering 을 꺼서 임시파일 없이 그대로 흘린다.
        location /studio/ {
            rewrite ^/studio(/.*)$ $1 break;
            proxy_pass http://$studio_dl;
            proxy_redirect http://studio-dl/ /studio/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 600s;
        }

        # Studio 번들 업로드 (~1GB). /api/ 는 nginx 기본 body 한도(1MB)라 이 경로만 따로 연다.
        # 목록·activate 는 아래 /api/ 로 충분하다.
        location = /api/v1/onprem/studio-releases {
            proxy_pass http://$tc_be;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 4g;          # TC 한도(STUDIO_BUNDLE_LIMITS.maxBundleBytes)와 맞춘다
            proxy_request_buffering off;      # 임시파일 없이 tc-be 로 흘린다
            proxy_read_timeout 600s;          # 수신 완료 후 해제·해시 검증 시간
            proxy_send_timeout 600s;
        }

        # /api -> tc-be
        location /api/ {
            proxy_pass http://$tc_be;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # / -> tc-fe (기본)
        location / {
            proxy_pass http://$tc_fe;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
