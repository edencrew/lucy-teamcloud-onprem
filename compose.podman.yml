name: lucy-teamcloud-onprem

networks:
  internal-network:
    external: false

volumes:
  # tc-be 가 업로드받은 Studio 릴리스를 풀어 두는 볼륨. current -> releases/<releaseId>/html 상대 심링크를
  # tc-be 가 교체하고 studio-dl 이 읽기 전용으로 서빙한다. 재업로드로 복구되므로 백업 대상은 아니다.
  studio-release:

services:
  gw:
    image: docker.io/library/nginx:1.26-alpine
    platform: ${TARGET_PLATFORM:-linux/amd64}
    restart: unless-stopped
    networks:
      - internal-network
    ports:
      - "18080:80"
      - "18443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./nginx/certs:/etc/nginx/certs:ro,z
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
      git:
        condition: service_started
      auth-be:
        condition: service_healthy
      auth-fe:
        condition: service_started
      tc-be:
        condition: service_healthy
      tc-fe:
        condition: service_started
      studio-dl:
        condition: service_started

  git:
    image: docker.gitea.com/gitea:1.25.3
    platform: ${TARGET_PLATFORM:-linux/amd64}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - LUCY_ADMIN_NAME=${LUCY_ADMIN_NAME}
      - LUCY_ADMIN_PASSWORD=${LUCY_ADMIN_PASSWORD}
      - EXTERNAL_URL=${EXTERNAL_URL}
      - USER_UID=${HOST_UID:-1000}
      - USER_GID=${HOST_GID:-1000}
      - TZ=${TZ:-UTC}
      - GITEA__database__USER=${DB_USERNAME}
      - GITEA__database__PASSWD=${DB_PASSWORD}
      - GITEA__server__DISABLE_SSH=true
    networks:
      - internal-network
    volumes:
      - ./git/data:/data:z
      - ./git/app.ini:/app.ini.default:ro,z
      - ./git/gitea-entrypoint.sh:/gitea-entrypoint.sh:ro,z
      - ./secrets:/run/secrets:ro,z
    entrypoint: ["/bin/sh", "/gitea-entrypoint.sh"]

  db:
    image: docker.io/library/postgres:17
    platform: ${TARGET_PLATFORM:-linux/amd64}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      - POSTGRES_PASSWORD=${DB_ROOT_PASSWORD}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - TZ=${TZ:-UTC}
    networks:
      - internal-network
    volumes:
      - ./postgres/data:/var/lib/postgresql/data:z
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro,z

  broker:
    image: docker.io/library/eclipse-mosquitto:2.0.22
    platform: ${TARGET_PLATFORM:-linux/amd64}
    restart: unless-stopped
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,z
      - ./broker/data:/mosquitto/data:z
      - ./broker/logs:/mosquitto/log:z
    networks:
      - internal-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  auth-be:
    image: public.ecr.aws/edencrew/lucy-auth-be:onprem-prod-0.1.0
    platform: ${TARGET_PLATFORM:-linux/amd64}
    user: "0:0"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      SERVICE_ENV: onprem
      SERVICE_PORT: 80
      FRONTEND_URL: ${EXTERNAL_URL}/auth
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: lucy_auth
      DATABASE_URL: "postgresql://${DB_USERNAME}:${DB_PASSWORD}@db:5432/lucy_auth"
      ADMIN_EMAIL: ${LUCY_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${LUCY_ADMIN_PASSWORD}
      ADMIN_NAME: ${LUCY_ADMIN_NAME}
      JWT_EXPIRES_TIME: 60m
      OIDC_ISSUER: ${EXTERNAL_URL}/auth
      EXTERNAL_URL: ${EXTERNAL_URL}
      NODE_EXTRA_CA_CERTS: /certs/server.crt
    volumes:
      - ./secrets:/run/secrets:ro,z
      - ./auth/auth-entrypoint.sh:/auth-entrypoint.sh:ro,z
      - ./nginx/certs/server.crt:/certs/server.crt:ro,z
      - ./auth/logs:/app/logs:z
    entrypoint: ["/bin/sh", "/auth-entrypoint.sh"]
    networks:
      - internal-network

  tc-be:
    image: public.ecr.aws/edencrew/lucy-teamcloud-be:onprem-prod-0.0.21
    platform: ${TARGET_PLATFORM:-linux/amd64}
    user: "0:0"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      SERVICE_ENV: onprem
      SERVICE_PORT: 80
      TEAMCLOUD_URL: ${EXTERNAL_URL}
      AUTH_SERVER_URL: ${EXTERNAL_URL}/auth
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: lucy_teamcloud
      DATABASE_URL: "postgresql://${DB_USERNAME}:${DB_PASSWORD}@db:5432/lucy_teamcloud"
      GIT_PROVIDER: gitea
      GIT_HOST: http://git:18080
      GIT_USERNAME: ${LUCY_ADMIN_NAME}
      GIT_PASSWORD: ${LUCY_ADMIN_PASSWORD}
      WEBHOOK_URL: "http://tc-be/api/webhooks/gitea"
      OIDC_CLIENT_ID: lucy-teamcloud-oidc-client-id
      BROKER_WS_URL: ${BROKER_WS_URL}
      PUBLIC_BROKER_WS_URL: ${PUBLIC_BROKER_WS_URL}
      NODE_EXTRA_CA_CERTS: /certs/server.crt
      STUDIO_RELEASE_DIR: /data/studio-releases
    volumes:
      - ./secrets:/run/secrets:ro,z
      - ./tc/tc-entrypoint.sh:/tc-entrypoint.sh:ro,z
      - ./license:/app/license:ro,z
      - ./nginx/certs/server.crt:/certs/server.crt:ro,z
      - ./tc/logs:/app/logs:z
      # 이미지가 /data/studio-releases 를 uid 1001 소유로 만들어 두어, 빈 named volume 이 첫 마운트 때 소유자를
      # 물려받는다. bind mount 로 바꾸려면 호스트 디렉터리를 1001 소유로 만들어야 한다.
      - studio-release:/data/studio-releases
    entrypoint: ["/bin/sh", "/tc-entrypoint.sh"]
    networks:
      - internal-network

  tc-fe:
    image: public.ecr.aws/edencrew/lucy-teamcloud-fe:onprem-prod-0.0.17
    platform: ${TARGET_PLATFORM:-linux/amd64}
    restart: unless-stopped
    networks:
      - internal-network

  auth-fe:
    image: public.ecr.aws/edencrew/lucy-auth-fe:onprem-prod-0.1.0
    platform: ${TARGET_PLATFORM:-linux/amd64}
    restart: unless-stopped
    networks:
      - internal-network

  # Studio 설치·업데이트 파일 정적 서빙. gw 의 /studio/ 로만 접근하고 외부 포트는 열지 않는다.
  # Studio 배포는 TC 업로드(scripts/studio-upload.sh)로만 한다. tc-be 가 studio-release 볼륨에 릴리스를 풀고
  # 피드를 렌더링한 뒤 current 심링크를 바꾸면, 이 nginx 가 그 current 를 그대로 서빙한다.
  # 첫 업로드 전에는 current 가 없어 /studio/* 가 404 다(/healthz 는 200).
  studio-dl:
    image: docker.io/library/nginx:1.26-alpine
    platform: ${TARGET_PLATFORM:-linux/amd64}
    restart: unless-stopped
    volumes:
      - ./studio-dl/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
      - studio-release:/srv/studio:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal-network
