name: lucy-teamcloud-onprem

networks:
  internal-network:
    external: false

volumes:
  # tc-be 가 업로드받은 Studio 릴리스를 풀어 두는 볼륨. current -> releases/<releaseId>/html 상대 심링크를
  # tc-be 가 교체하고 studio-dl 이 읽기 전용으로 서빙한다. 재업로드로 복구되므로 백업 대상은 아니다.
  studio-release:

services:
  gw:
    image: docker.io/library/nginx:1.26-alpine
    platform: ${TARGET_PLATFORM:-linux/amd64}
    restart: unless-stopped
    networks:
      - internal-network
    ports:
      - "${TC_HTTP_PORT:-18080}:80"
      - "${TC_HTTPS_PORT:-18443}:443"
    volumes:
      # 제품 파일은 TC_PAYLOAD_DIR(ops: releases/<version>/payload, 기본 .), 데이터는 고정 프로젝트 디렉터리 기준
      # 설정은 템플릿으로만 읽고, stock entrypoint 가 resolver 를 채워 컨테이너 내부 /etc/nginx/nginx.conf 로 렌더링한다(재기동한 서비스 IP 를 요청 시 재조회).
      - ${TC_PAYLOAD_DIR:-.}/${TC_GW_CONFIG:-nginx/nginx.conf}:/etc/nginx/templates/nginx.conf.template:ro,z
      - ./nginx/certs:/etc/nginx/certs:ro,z
    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: ^NGINX_LOCAL_RESOLVERS$$
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
      git:
        condition: service_started
      auth-be:
        condition: service_healthy
      auth-fe:
        condition: service_started
      tc-be:
        condition: service_healthy
      tc-fe:
        condition: service_started
      studio-dl:
        condition: service_started

  git:
    image: docker.gitea.com/gitea:1.25.3
    platform: ${TARGET_PLATFORM:-linux/amd64}
    restart: unless-stopped
    # rootless: 호스트 설치 계정을 컨테이너의 USER_UID/USER_GID 로 매핑(keep-id)해 ./git/data 가 호스트 소유로 생성된다.
    # 래퍼와 stock entrypoint(s6)는 root 로 시작해 git 사용자를 USER_UID 로 맞춘 뒤 내려가므로 user 는 root 로 고정한다.
    userns_mode: "keep-id:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000}"
    user: "0:0"
    # 관리자 계정 마커(.admin-created)까지 확인해, 계정 생성 전에 tc-be 가 Gitea 를 호출하던 첫 부팅 경합을 막는다.
    # curl 은 Gitea 이미지에 포함. start_period 는 첫 부팅의 DB 마이그레이션 + 계정 생성 시간을 감안한 값.
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/gitea/.admin-created && curl -fsS http://localhost:18080/api/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    environment:
      - LUCY_ADMIN_NAME=${LUCY_ADMIN_NAME}
      - LUCY_ADMIN_PASSWORD=${LUCY_ADMIN_PASSWORD}
      - EXTERNAL_URL=${EXTERNAL_URL}
      - USER_UID=${HOST_UID:-1000}
      - USER_GID=${HOST_GID:-1000}
      # stock s6 openssh setup 의 host key root chown 을 데이터 소유자 key 에 한해 건너뛰는 래퍼 opt-in(Podman 전용)
      - TC_GITEA_SSH_KEY_OWNER=data
      - TZ=${TZ:-UTC}
      - GITEA__database__USER=${DB_USERNAME}
      - GITEA__database__PASSWD=${DB_PASSWORD}
      - GITEA__server__DISABLE_SSH=true
    networks:
      - internal-network
    volumes:
      - ./git/data:/data:z
      - ${TC_PAYLOAD_DIR:-.}/git/app.ini:/app.ini.default:ro,z
      - ${TC_PAYLOAD_DIR:-.}/git/gitea-entrypoint.sh:/gitea-entrypoint.sh:ro,z
      - ./secrets:/run/secrets:ro,z
    entrypoint: ["/bin/sh", "/gitea-entrypoint.sh"]

  db:
    image: docker.io/library/postgres:17
    platform: ${TARGET_PLATFORM:-linux/amd64}
    # rootless: 호스트 설치 계정 = 컨테이너 postgres(999). initdb 부터 999 로 실행되어(root 미경유) 데이터가 호스트 소유.
    userns_mode: "keep-id:uid=999,gid=999"
    user: "999:999"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      - POSTGRES_PASSWORD=${DB_ROOT_PASSWORD}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - TZ=${TZ:-UTC}
    networks:
      - internal-network
    volumes:
      - ./postgres/data:/var/lib/postgresql/data:z
      - ${TC_PAYLOAD_DIR:-.}/postgres/initdb:/docker-entrypoint-initdb.d:ro,z

  broker:
    image: docker.io/library/eclipse-mosquitto:2.0.22
    platform: ${TARGET_PLATFORM:-linux/amd64}
    # rootless: 호스트 설치 계정 = 컨테이너 mosquitto(1883). persistence/log 가 호스트 소유로 생성된다.
    userns_mode: "keep-id:uid=1883,gid=1883"
    user: "1883:1883"
    restart: unless-stopped
    volumes:
      - ${TC_PAYLOAD_DIR:-.}/broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,z
      - ./broker/data:/mosquitto/data:z
      - ./broker/logs:/mosquitto/log:z
    networks:
      - internal-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  auth-be:
    image: public.ecr.aws/edencrew/lucy-auth-be:onprem-prod-0.1.2
    platform: ${TARGET_PLATFORM:-linux/amd64}
    user: "0:0"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      SERVICE_ENV: onprem
      SERVICE_PORT: 80
      FRONTEND_URL: ${EXTERNAL_URL}/auth
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: lucy_auth
      DATABASE_URL: "postgresql://${DB_USERNAME}:${DB_PASSWORD}@db:5432/lucy_auth"
      ADMIN_EMAIL: ${LUCY_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${LUCY_ADMIN_PASSWORD}
      ADMIN_NAME: ${LUCY_ADMIN_NAME}
      JWT_EXPIRES_TIME: 60m
      OIDC_ISSUER: ${EXTERNAL_URL}/auth
      EXTERNAL_URL: ${EXTERNAL_URL}
      NODE_EXTRA_CA_CERTS: /certs/server.crt
    volumes:
      - ./secrets:/run/secrets:ro,z
      - ${TC_PAYLOAD_DIR:-.}/auth/auth-entrypoint.sh:/auth-entrypoint.sh:ro,z
      - ./nginx/certs/server.crt:/certs/server.crt:ro,z
      - ./auth/logs:/app/logs:z
    entrypoint: ["/bin/sh", "/auth-entrypoint.sh"]
    networks:
      - internal-network

  tc-be:
    image: public.ecr.aws/edencrew/lucy-teamcloud-be:onprem-prod-0.0.25
    platform: ${TARGET_PLATFORM:-linux/amd64}
    # rootless: 호스트 설치 계정 = 이미지 기본 사용자 appuser(1001:1001). logs/Studio 쓰기는 호스트 계정 소유,
    # 호스트 계정 소유 secret/cert/license 는 1001 로 읽힌다. app/entrypoint.sh 는 root 를 요구하지 않는다.
    userns_mode: "keep-id:uid=1001,gid=1001"
    user: "1001:1001"
    # 비root 1001 이 컨테이너 내부 80 을 bind 하도록 이 컨테이너 network namespace 에서만 특권 포트 하한을 0 으로 둔다.
    # 호스트 sysctl·capability·호스트 포트 매핑은 바꾸지 않는다.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # git 의 관리자 계정이 준비된 뒤에 기동 (첫 부팅 Gitea 401 경합 제거)
      git:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      SERVICE_ENV: onprem
      SERVICE_PORT: 80
      TEAMCLOUD_URL: ${EXTERNAL_URL}
      AUTH_SERVER_URL: ${EXTERNAL_URL}/auth
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: lucy_teamcloud
      DATABASE_URL: "postgresql://${DB_USERNAME}:${DB_PASSWORD}@db:5432/lucy_teamcloud"
      GIT_PROVIDER: gitea
      GIT_HOST: http://git:18080
      GIT_USERNAME: ${LUCY_ADMIN_NAME}
      GIT_PASSWORD: ${LUCY_ADMIN_PASSWORD}
      WEBHOOK_URL: "http://tc-be/api/webhooks/gitea"
      OIDC_CLIENT_ID: lucy-teamcloud-oidc-client-id
      BROKER_WS_URL: ${BROKER_WS_URL}
      PUBLIC_BROKER_WS_URL: ${PUBLIC_BROKER_WS_URL}
      NODE_EXTRA_CA_CERTS: /certs/server.crt
      STUDIO_RELEASE_DIR: /data/studio-releases
    volumes:
      - ./secrets:/run/secrets:ro,z
      - ${TC_PAYLOAD_DIR:-.}/tc/tc-entrypoint.sh:/tc-entrypoint.sh:ro,z
      - ./license:/app/license:ro,z
      - ./nginx/certs/server.crt:/certs/server.crt:ro,z
      - ./tc/logs:/app/logs:z
      # 이미지의 /data/studio-releases 는 1001:1001 0755 다. keep-id 로 컨테이너 1001 = 호스트 계정이므로
      # 새 볼륨의 Studio 파일은 호스트 계정 소유다. 이전 매핑으로 만든 기존 볼륨은 README 이전 절차 대상이다.
      - studio-release:/data/studio-releases
    entrypoint: ["/bin/sh", "/tc-entrypoint.sh"]
    networks:
      - internal-network

  tc-fe:
    image: public.ecr.aws/edencrew/lucy-teamcloud-fe:onprem-prod-0.0.18
    platform: ${TARGET_PLATFORM:-linux/amd64}
    restart: unless-stopped
    networks:
      - internal-network

  auth-fe:
    image: public.ecr.aws/edencrew/lucy-auth-fe:onprem-prod-0.1.1
    platform: ${TARGET_PLATFORM:-linux/amd64}
    restart: unless-stopped
    networks:
      - internal-network

  # Studio 설치·업데이트 파일 정적 서빙. gw 의 /studio/ 로만 접근하고 외부 포트는 열지 않는다.
  # Studio 배포는 TC 업로드(scripts/studio-upload.sh)로만 한다. tc-be 가 studio-release 볼륨에 릴리스를 풀고
  # 피드를 렌더링한 뒤 current 심링크를 바꾸면, 이 nginx 가 그 current 를 그대로 서빙한다.
  # 첫 업로드 전에는 current 가 없어 /studio/* 가 404 다(/healthz 는 200).
  studio-dl:
    image: docker.io/library/nginx:1.26-alpine
    platform: ${TARGET_PLATFORM:-linux/amd64}
    restart: unless-stopped
    volumes:
      - ${TC_PAYLOAD_DIR:-.}/studio-dl/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
      - studio-release:/srv/studio:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal-network
