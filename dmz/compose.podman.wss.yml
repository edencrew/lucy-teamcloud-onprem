name: lucy-teamcloud-dmz

services:
  dmz-mqtt-proxy:
    image: docker.io/library/nginx:1.26-alpine
    platform: ${TARGET_PLATFORM:-linux/amd64}
    restart: unless-stopped
    ports:
      - "18080:80"
      - "18443:443"
    environment:
      DMZ_SERVER_NAME: ${DMZ_SERVER_NAME}
      INTERNAL_MQTT_UPSTREAM: ${INTERNAL_MQTT_UPSTREAM}
      DMZ_TLS_CERTIFICATE: ${DMZ_TLS_CERTIFICATE:-/etc/nginx/certs/server.crt}
      DMZ_TLS_CERTIFICATE_KEY: ${DMZ_TLS_CERTIFICATE_KEY:-/etc/nginx/certs/server.key}
      DMZ_HTTPS_REDIRECT_ORIGIN: https://${DMZ_SERVER_NAME}:18443
    volumes:
      - ./nginx:/etc/nginx/templates:ro,z
      - ./certs:/etc/nginx/certs:ro,z
    command:
      - /bin/sh
      - -ec
      - |
        envsubst '$$DMZ_SERVER_NAME $$INTERNAL_MQTT_UPSTREAM $$DMZ_TLS_CERTIFICATE $$DMZ_TLS_CERTIFICATE_KEY $$DMZ_HTTPS_REDIRECT_ORIGIN' \
          < /etc/nginx/templates/nginx.wss.conf.template \
          > /etc/nginx/nginx.conf
        nginx -t
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
