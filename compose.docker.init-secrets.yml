name: lucy-teamcloud-onprem

# 최초 설치/산출물 누락 시에만 compose.docker.yml 과 함께 명시적으로 실행하는 bootstrap 전용 파일.
# 업데이트(설치된 ctl/ops)는 이 파일을 쓰지 않으며 비밀/키/인증서를 재생성하지 않는다.
services:
  init-secrets:
    image: lucy-teamcloud-onprem-init-secrets:offline
    build:
      context: ${TC_PAYLOAD_DIR:-.}/init-secrets
    platform: ${TARGET_PLATFORM:-linux/amd64}
    restart: "no"
    network_mode: none
    environment:
      EXTERNAL_URL: ${EXTERNAL_URL}
    volumes:
      - ./secrets:/secrets
      - ./nginx/certs:/certs
